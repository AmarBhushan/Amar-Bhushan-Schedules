<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Amar Bhushan Schedule</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    :root { --sat: env(safe-area-inset-top); --sab: env(safe-area-inset-bottom); }
    .safe-top { padding-top: max(var(--sat), 1rem); }
    .pb-safe { padding-bottom: max(var(--sab), 1rem); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    body { -webkit-tap-highlight-color: transparent; font-family: 'Inter', sans-serif; }
    
    /* Custom date picker styling for native look */
    input[type="date"], input[type="time"] { min-height: 44px; }
    
    /* Hide native date picker calendar icon to use custom one */
    input[type="date"]::-webkit-calendar-picker-indicator {
        opacity: 0; width: 100%; height: 100%; position: absolute; top: 0; left: 0; cursor: pointer;
    }
  </style>
</head>
<body class="bg-gray-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const DEFAULT_TIMEZONES = [
      { value: 'Asia/Kolkata', label: 'India (IST)' },
      { value: 'America/New_York', label: 'USA Eastern (EST/EDT)' },
      { value: 'America/Chicago', label: 'USA Central (CST/CDT)' },
      { value: 'America/Denver', label: 'USA Mountain (MST/MDT)' },
      { value: 'America/Los_Angeles', label: 'USA Pacific (PST/PDT)' },
      { value: 'America/Anchorage', label: 'USA Alaska (AKST/AKDT)' },
      { value: 'Pacific/Honolulu', label: 'USA Hawaii (HST)' },
      { value: 'Australia/Sydney', label: 'Australia Eastern (AEST/AEDT)' },
      { value: 'Australia/Brisbane', label: 'Australia Queensland (AEST)' },
      { value: 'Australia/Adelaide', label: 'Australia Central (ACST/ACDT)' },
      { value: 'Australia/Perth', label: 'Australia Western (AWST)' },
      { value: 'America/Toronto', label: 'Canada Eastern (EST/EDT)' },
      { value: 'America/Winnipeg', label: 'Canada Central (CST/CDT)' },
      { value: 'America/Edmonton', label: 'Canada Mountain (MST/MDT)' },
      { value: 'America/Vancouver', label: 'Canada Pacific (PST/PDT)' },
      { value: 'America/Halifax', label: 'Canada Atlantic (AST/ADT)' },
      { value: 'America/St_Johns', label: 'Canada Newfoundland (NST/NDT)' },
      { value: 'Europe/London', label: 'UK (GMT/BST)' },
      { value: 'Asia/Dubai', label: 'UAE (GST)' },
    ];

    const DEFAULT_SLOT_TYPES = [
      { id: 'morning', name: 'Morning', color: 'bg-yellow-100 border-yellow-300 text-yellow-800' },
      { id: 'afternoon', name: 'Afternoon', color: 'bg-orange-100 border-orange-300 text-orange-800' },
      { id: 'evening', name: 'Evening', color: 'bg-indigo-100 border-indigo-300 text-indigo-800' },
      { id: 'night', name: 'Night', color: 'bg-slate-100 border-slate-300 text-slate-800' },
    ];

    const DAYS_OF_WEEK = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

    const Icons = {
      Plus: ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
      Trash: ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>,
      Calendar: ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>,
      Clock: ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>,
      Globe: ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>,
      User: ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>,
      Users: ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>,
      Edit: ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>,
      X: ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>,
      Share: ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>,
      Download: ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>,
      Settings: ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>,
      MessageCircle: ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>,
      Copy: ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>,
      Link: ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
    };

    const toDateString = (date) => {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    };

    const addDays = (date, days) => new Date(date.getTime() + days * 86400000);
    
    const startOfWeek = (date) => {
      const d = new Date(date);
      const day = d.getDay();
      const diff = d.getDate() - day + (day === 0 ? -6 : 1); 
      return new Date(d.setDate(diff));
    };

    function App() {
      const [myTimeZone, setMyTimeZone] = useState(() => localStorage.getItem('amar_myTz') || 'Asia/Kolkata');
      const [headerTz, setHeaderTz] = useState(() => localStorage.getItem('amar_headerTz') || 'Australia/Sydney');
      const [meetingLink, setMeetingLink] = useState(() => localStorage.getItem('amar_meetingLink') || '');
      
      const [selectedWeekStart, setSelectedWeekStart] = useState(startOfWeek(new Date()));
      const [activeSlotFilter, setActiveSlotFilter] = useState('all');
      
      const [toastMsg, setToastMsg] = useState(null);

      const [slotDefinitions, setSlotDefinitions] = useState(() => {
        const saved = localStorage.getItem('amar_slotDefs');
        return saved ? JSON.parse(saved) : DEFAULT_SLOT_TYPES;
      });

      const [timezones, setTimezones] = useState(() => {
        const saved = localStorage.getItem('amar_timezones');
        if (saved) {
          const parsed = JSON.parse(saved);
          const missing = DEFAULT_TIMEZONES.filter(d => !parsed.some(p => p.value === d.value));
          return [...parsed, ...missing];
        }
        return DEFAULT_TIMEZONES;
      });

      const [schedules, setSchedules] = useState(() => {
        const saved = localStorage.getItem('amar_schedules');
        let parsed = saved ? JSON.parse(saved) : [];
        
        // Migration: Automatically split any legacy "Every Day" slots into 7 independent slots
        const hasLegacyAll = parsed.some(s => s.dayOfWeek === 'all');
        if (hasLegacyAll) {
            let newSch = [];
            parsed.forEach(s => {
                if (s.dayOfWeek === 'all') {
                    DAYS_OF_WEEK.forEach((_, idx) => {
                        newSch.push({ ...s, dayOfWeek: idx.toString(), id: s.id + '_split_' + idx });
                    });
                } else {
                    newSch.push(s);
                }
            });
            parsed = newSch;
        }
        return parsed;
      });

      const [students, setStudents] = useState(() => {
        const saved = localStorage.getItem('amar_students');
        return saved ? JSON.parse(saved) : [];
      });

      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [isStudentsModalOpen, setIsStudentsModalOpen] = useState(false);
      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [selectedSlotDetails, setSelectedSlotDetails] = useState(null);
      const [editingScheduleId, setEditingScheduleId] = useState(null);
      const [confirmDialog, setConfirmDialog] = useState(null);
      const [editingStudentInfo, setEditingStudentInfo] = useState(null);
      const [showStudentSuggestions, setShowStudentSuggestions] = useState(false);

      const [isShareModalOpen, setIsShareModalOpen] = useState(false);
      const [shareConfig, setShareConfig] = useState({ tz: headerTz, category: 'all' });
      const [generatedImage, setGeneratedImage] = useState(null);
      const [isGenerating, setIsGenerating] = useState(false);
      const sharePosterRef = useRef(null);

      const [formData, setFormData] = useState({
        dayOfWeek: 'all', 
        exactDate: toDateString(new Date()),
        slotTypeId: DEFAULT_SLOT_TYPES[0].id,
        startTime: '05:00',
        endTime: '06:00',
        studentName: '',
        whatsapp: '',
        grade: '',
        isDemo: false,
        studentTimeZone: 'Australia/Sydney'
      });

      const [currentTime, setCurrentTime] = useState(new Date());

      useEffect(() => {
         const timer = setInterval(() => setCurrentTime(new Date()), 60000);
         return () => clearInterval(timer);
      }, []);

      useEffect(() => {
        localStorage.setItem('amar_schedules', JSON.stringify(schedules));
        localStorage.setItem('amar_slotDefs', JSON.stringify(slotDefinitions));
        localStorage.setItem('amar_timezones', JSON.stringify(timezones));
        localStorage.setItem('amar_students', JSON.stringify(students));
        localStorage.setItem('amar_myTz', myTimeZone);
        localStorage.setItem('amar_headerTz', headerTz);
        localStorage.setItem('amar_meetingLink', meetingLink);
      }, [schedules, slotDefinitions, timezones, students, myTimeZone, headerTz, meetingLink]);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3000);
      };

      const copyToClipboard = (text) => {
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text).then(() => showToast("Copied to clipboard!"));
        } else {
            let textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try { document.execCommand('copy'); showToast("Copied to clipboard!"); } 
            catch (err) { showToast("Failed to copy"); }
            textArea.remove();
        }
      };

      const weekDates = useMemo(() => {
        return Array.from({ length: 7 }).map((_, i) => addDays(selectedWeekStart, i));
      }, [selectedWeekStart]);

      const getStudentTime = (myTimeStr, studentTz) => {
        try {
          const [hours, minutes] = myTimeStr.split(':');
          const date = new Date();
          date.setHours(parseInt(hours, 10), parseInt(minutes, 10), 0);
          return new Intl.DateTimeFormat('en-US', { timeZone: studentTz, hour: '2-digit', minute: '2-digit', hour12: true }).format(date);
        } catch (e) {
          return 'Invalid Time';
        }
      };

      const getTimeRange = (startStr, endStr, tz) => {
         return `${getStudentTime(startStr, tz)} - ${getStudentTime(endStr, tz)}`;
      };

      const getTargetDayAndTime = (timeStr, targetTz, baseDate) => {
        try {
          const [hours, minutes] = timeStr.split(':');
          const date = new Date(baseDate);
          date.setHours(parseInt(hours, 10), parseInt(minutes, 10), 0);
          
          const time = new Intl.DateTimeFormat('en-US', { timeZone: targetTz, hour: '2-digit', minute: '2-digit', hour12: true }).format(date);
          const day = new Intl.DateTimeFormat('en-US', { timeZone: targetTz, weekday: 'long' }).format(date);
          return { day, time, sortVal: date.getTime() };
        } catch (e) {
          return { day: 'Unknown', time: 'Invalid', sortVal: 0 };
        }
      };

      const getGreeting = (studentTz) => {
        try {
          const formatter = new Intl.DateTimeFormat('en-US', { timeZone: studentTz, hour: 'numeric', hour12: false });
          const studentHour = parseInt(formatter.format(new Date()), 10);
          
          if (studentHour >= 4 && studentHour < 12) return 'Good Morning';
          if (studentHour >= 12 && studentHour < 17) return 'Good Afternoon';
          return 'Good Evening';
        } catch (e) {
          return 'Hello';
        }
      };

      const generateMessage = (sch, viewDate, isBooking = false) => {
        const greeting = getGreeting(sch.studentTimeZone);
        const dateStr = viewDate.toLocaleDateString('en-US', { month: 'long', day: 'numeric' });
        const dayStr = viewDate.toLocaleDateString('en-US', { weekday: 'long' });
        const timeStr = getStudentTime(sch.startTime, sch.studentTimeZone);
        const tzLabel = timezones.find(t => t.value === sch.studentTimeZone)?.label || '';
        
        if (sch.isDemo && isBooking) {
          return `${greeting},\nThank you for booking the demo class for Maths.\n\nPlease find the class details below:\n📅 Date: ${dateStr}\n⏰ Time: ${timeStr} (${tzLabel})\n🔗 Meeting Link: ${meetingLink}\n\nKindly ensure that the student joins the session 5 minutes before the scheduled time with:\n✔ Notebook\n✔ Pen/Pencil\n✔ Calculator (if required)\n✔ Previous worksheets/books (if applicable)\n\nThe demo class will help assess the student’s current level, understanding, and learning requirements so that proper planning can be done for future sessions.\nIn case of any issue joining the meeting, please inform me beforehand.\nLooking forward to meeting you and the student.\n\nThanks,\nAmar Bhushan`;
        } else {
          return `${greeting},\n\nThis is a reminder for our session.\n📅 Time: ${dayStr}, ${timeStr} (${tzLabel})\n\n🔗 Link: ${meetingLink}\n\nThanks,\nAmar Bhushan`;
        }
      };

      const handleDateChange = (e) => {
        if(!e.target.value) return;
        const d = new Date(e.target.value);
        setSelectedWeekStart(startOfWeek(d));
      };

      const handleUpdateStudent = (updatedStudent) => {
        const oldStudent = students.find(s => s.id === updatedStudent.id);
        if (!oldStudent) return;

        // Update the student in the directory
        setStudents(students.map(s => s.id === updatedStudent.id ? updatedStudent : s));

        // Globally update this student's details in ALL their existing slots
        setSchedules(schedules.map(sch => {
            if (sch.studentName && sch.studentName.toLowerCase() === oldStudent.name.toLowerCase()) {
                return {
                    ...sch,
                    studentName: updatedStudent.name,
                    grade: updatedStudent.grade,
                    whatsapp: updatedStudent.whatsapp,
                    studentTimeZone: updatedStudent.timeZone
                };
            }
            return sch;
        }));
        
        setEditingStudentInfo(null);
        showToast("Student Updated Globally");
      };

      const handleSaveSchedule = (e) => {
        e.preventDefault();
        const payload = { ...formData, isDemo: formData.isDemo || false };
        
        // Auto-add or update student in the directory
        if (payload.studentName.trim()) {
           const existingIdx = students.findIndex(s => s.name.toLowerCase() === payload.studentName.trim().toLowerCase());
           const studentObj = {
               id: existingIdx >= 0 ? students[existingIdx].id : 'stu_' + Date.now(),
               name: payload.studentName.trim(),
               grade: payload.grade,
               whatsapp: payload.whatsapp,
               timeZone: payload.studentTimeZone
           };
           if (existingIdx >= 0) {
               const newSt = [...students];
               newSt[existingIdx] = studentObj;
               setStudents(newSt);
           } else {
               setStudents([...students, studentObj]);
           }
        }

        let newSchedules = [...schedules];

        // Process creation or editing, splitting "all" into independent days
        if (editingScheduleId) {
             if (payload.dayOfWeek === 'all') {
                 newSchedules = newSchedules.filter(s => s.id !== editingScheduleId);
                 DAYS_OF_WEEK.forEach((_, idx) => {
                     newSchedules.push({ ...payload, dayOfWeek: idx.toString(), id: Date.now().toString() + '_' + idx });
                 });
             } else {
                 newSchedules = newSchedules.map(sch => sch.id === editingScheduleId ? { ...payload, id: editingScheduleId } : sch);
             }
        } else {
             if (payload.dayOfWeek === 'all') {
                 DAYS_OF_WEEK.forEach((_, idx) => {
                     newSchedules.push({ ...payload, dayOfWeek: idx.toString(), id: Date.now().toString() + '_' + idx });
                 });
             } else {
                 newSchedules.push({ ...payload, id: Date.now().toString() });
             }
        }

        setSchedules(newSchedules);
        setIsAddModalOpen(false);
        setEditingScheduleId(null);
        setSelectedSlotDetails(null);
      };

      const handleDeleteSchedule = (id) => {
        setSchedules(schedules.filter(sch => sch.id !== id));
        setSelectedSlotDetails(null);
      };

      const handleUnassignStudent = (id) => {
        setSchedules(schedules.map(sch => sch.id === id ? { ...sch, studentName: '', grade: '', whatsapp: '', isDemo: false } : sch));
        setSelectedSlotDetails(null);
      };

      const handleAddSlotDefinition = (name) => {
        if (!name.trim()) return;
        const id = name.toLowerCase().replace(/\W/g, '') + Date.now();
        const colors = ['bg-pink-100 border-pink-300 text-pink-800', 'bg-teal-100 border-teal-300 text-teal-800', 'bg-purple-100 border-purple-300 text-purple-800', 'bg-cyan-100 border-cyan-300 text-cyan-800'];
        const color = colors[slotDefinitions.length % colors.length];
        setSlotDefinitions([...slotDefinitions, { id, name, color }]);
        showToast("Category Added");
      };

      const handleUpdateSlotDefinition = (id, newName) => {
        setSlotDefinitions(slotDefinitions.map(s => s.id === id ? { ...s, name: newName } : s));
      };

      const handleDeleteSlotDefinition = (id) => {
        if (slotDefinitions.length <= 1) return showToast("Cannot delete last category");
        setSlotDefinitions(slotDefinitions.filter(s => s.id !== id));
        if (activeSlotFilter === id) setActiveSlotFilter('all');
        const remaining = slotDefinitions.filter(s => s.id !== id);

        } else if (confirmDialog.action === 'deleteCategory') {

                sch.studentName.toLowerCase() === student.name.toLowerCase()

                       displayRange: `${startInfo.time} - ${endInfo.time}`,
                       sortVal: startInfo.sortVal

            }

                        {formData.studentTimeZone && formData.startTime && (
                          <span className="text-[10px] bg-blue-100 text-blue-800 px-2 py-0.5 rounded font-bold border border-blue-200 truncate max-w-[150px]">
                            Sees: {getStudentTime(formData.startTime, formData.studentTimeZone)}
                          </span>
                        )}
                      </div>
                      <div className="grid grid-cols-2 gap-2 sm:gap-4">
                        <div className="min-w-0">
                          <label className="block text-xs text-gray-500 mb-1">Start Time</label>
                          <input type="time" required value={formData.startTime} onChange={(e) => setFormData({...formData, startTime: e.target.value})} className="min-w-0 w-full p-2 text-sm appearance-none border border-gray-300 rounded-lg outline-none bg-white"/>
                        </div>
                        <div className="min-w-0">
                          <label className="block text-xs text-gray-500 mb-1">End Time</label>
                          <input type="time" required value={formData.endTime} onChange={(e) => setFormData({...formData, endTime: e.target.value})} className="min-w-0 w-full p-2 text-sm appearance-none border border-gray-300 rounded-lg outline-none bg-white"/>
                        </div>
                      </div>
                    </div>

                    {/* Student Details section */}
                    <div className="pt-2 border-t">
                      <div className="flex justify-between items-center mb-2">
                        <label className="block text-sm font-bold text-gray-800">Student Assignment</label>
                        <span className="text-[10px] text-green-700 font-bold bg-green-100 px-2 py-0.5 rounded border border-green-200">Leave empty for VACANT</span>
                      </div>
                      
                      <div className="space-y-3">
                         {/* Student Name Input with Custom Dropdown */}
                         <div className="relative">
                           <input 
                             type="text" 
                             placeholder="Student Name (e.g. John Doe)" 
                             value={formData.studentName} 
                             onFocus={() => setShowStudentSuggestions(true)}
                             onBlur={() => setTimeout(() => setShowStudentSuggestions(false), 200)}
                             onChange={(e) => {
                               setFormData({...formData, studentName: e.target.value});
                               setShowStudentSuggestions(true);
                             }}
                             className="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm"
                           />
                           
                           {showStudentSuggestions && (
                             <div className="absolute z-10 w-full mt-1 bg-white border border-gray-300 rounded-xl shadow-lg max-h-48 overflow-y-auto">
                               {students.filter(s => s.name.toLowerCase().includes(formData.studentName.toLowerCase())).map(s => (
                                 <div 
                                   key={s.id} 
                                   className="p-3 hover:bg-blue-50 cursor-pointer border-b border-gray-100 last:border-0 transition"
                                   onClick={() => {
                                     setFormData({...formData, studentName: s.name, grade: s.grade, whatsapp: s.whatsapp, studentTimeZone: s.timeZone});
                                     setShowStudentSuggestions(false);
                                   }}
                                 >
                                   <div className="font-bold text-gray-800 text-sm flex justify-between">
                                     <span>{s.name}</span>
                                     <span className="text-blue-600 text-xs font-semibold">Select</span>
                                   </div>
                                   <div className="text-xs text-gray-500 mt-0.5 truncate">
                                     {s.grade ? `Grade: ${s.grade} • ` : ''}{timezones.find(t=>t.value===s.timeZone)?.label || s.timeZone}
                                   </div>
                                 </div>
                               ))}
                               {students.filter(s => s.name.toLowerCase().includes(formData.studentName.toLowerCase())).length === 0 && (
                                 <div className="p-3 text-sm text-gray-500 italic">Type to save as a new student...</div>
                               )}
                             </div>
                           )}
                         </div>
                         
                         {/* Extra fields only if student is assigned */}
                         {formData.studentName && (
                           <>
                             <label className="flex items-center gap-2 p-3 bg-yellow-50 border border-yellow-300 rounded-xl cursor-pointer">
                               <input type="checkbox" checked={formData.isDemo} onChange={(e) => setFormData({...formData, isDemo: e.target.checked})} className="w-5 h-5 text-yellow-600 rounded focus:ring-yellow-500"/>
                               <span className="text-sm font-bold text-yellow-900">This is a Demo Class</span>
                             </label>

                             <div className="grid grid-cols-2 gap-3">
                               <div>
                                 <label className="block text-xs font-bold text-gray-500 mb-1">Grade/Level</label>
                                 <input 
                                   type="text" placeholder="e.g. Grade 10" value={formData.grade} onChange={(e) => setFormData({...formData, grade: e.target.value})}
                                   className="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm"
                                 />
                               </div>
                               <div>
                                 <label className="block text-xs font-bold text-gray-500 mb-1">WhatsApp Number</label>
                                 <input 
                                   type="tel" placeholder="e.g. +61..." value={formData.whatsapp} onChange={(e) => setFormData({...formData, whatsapp: e.target.value})}
                                   className="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm"
                                 />
                               </div>
                             </div>

                             <div>
                               <label className="block text-xs font-bold text-gray-500 mb-1">Student Time Zone</label>
                               <select 
                                 value={formData.studentTimeZone}
                                 onChange={(e) => setFormData({...formData, studentTimeZone: e.target.value})}
                                 className="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none bg-white text-sm"
                               >
                                 {timezones.map(tz => <option key={tz.value} value={tz.value}>{tz.label}</option>)}
                               </select>
                             </div>
                           </>
                         )}
                      </div>
                    </div>

                  </form>
                </div>
                
                <div className="p-4 border-t bg-gray-50 pb-safe">
                  <button type="submit" form="schedule-form" className="w-full py-4 bg-blue-600 text-white font-bold rounded-xl shadow-lg shadow-blue-200 hover:bg-blue-700 active:scale-[0.98] transition-all">
                    {editingScheduleId ? 'Save Slot Updates' : 'Create Slot'}
                  </button>
                </div>
              </div>
            </div>
          )}

          {}
          {isShareModalOpen && (
            <div className="fixed inset-0 bg-black/70 z-[90] flex flex-col justify-end sm:justify-center sm:p-4 backdrop-blur-sm">
              <div className="bg-gray-100 w-full sm:max-w-md sm:mx-auto rounded-t-3xl sm:rounded-2xl shadow-2xl flex flex-col max-h-[95vh] relative overflow-hidden">
                
                {/* Header */}
                <div className="flex justify-between items-center p-4 border-b bg-white">
                  <h2 className="text-lg font-bold text-gray-800 flex items-center gap-2"><Icons.Share size={18}/> Share Vacant Slots</h2>
                  <button onClick={() => setIsShareModalOpen(false)} className="p-2 bg-gray-100 rounded-full text-gray-600"><Icons.X size={20} /></button>
                </div>

                <div className="p-4 bg-white space-y-4">
                  <div className="grid grid-cols-2 gap-3">
                     <div>
                       <label className="block text-xs font-bold text-gray-500 mb-1">Target Timezone</label>
                       <select 
                         value={shareConfig.tz} onChange={(e) => { setShareConfig({...shareConfig, tz: e.target.value}); setGeneratedImage(null); }}
                         className="w-full p-2 border border-gray-300 rounded-lg text-sm outline-none"
                       >
                         {timezones.map(t => <option key={t.value} value={t.value}>{t.label}</option>)}
                       </select>
                     </div>
                     <div>
                       <label className="block text-xs font-bold text-gray-500 mb-1">Filter Category</label>
                       <select 
                         value={shareConfig.category} onChange={(e) => { setShareConfig({...shareConfig, category: e.target.value}); setGeneratedImage(null); }}
                         className="w-full p-2 border border-gray-300 rounded-lg text-sm outline-none"
                       >
                         <option value="all">All Categories</option>
                         {slotDefinitions.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                       </select>
                     </div>
                  </div>
                </div>

                <div className="flex-1 overflow-y-auto p-4 flex flex-col items-center justify-center min-h-[300px]">
                   {!generatedImage ? (
                      <button 
                        onClick={handleGenerateImage}
                        disabled={isGenerating}
                        className="px-6 py-3 bg-blue-600 text-white font-bold rounded-xl shadow-lg hover:bg-blue-700 active:scale-95 transition flex items-center gap-2"
                      >
                         {isGenerating ? 'Generating Image...' : 'Generate Poster Image'}
                      </button>
                   ) : (
                      <div className="w-full flex flex-col items-center space-y-4 animate-[slide-up_0.3s_ease-out]">
                         <img src={generatedImage} alt="Available Slots" className="w-3/4 rounded-xl shadow-md border border-gray-200" />
                         <p className="text-xs text-gray-500 font-medium">Long-press image to save, or use button below.</p>
                         <button 
                           onClick={handleShareImage}
                           className="w-full py-4 bg-green-600 text-white font-bold rounded-xl shadow-lg hover:bg-green-700 active:scale-95 transition flex justify-center items-center gap-2"
                         >
                            <Icons.Share size={18}/> Share / Save Image
                         </button>
                      </div>
                   )}
                </div>

              </div>
            </div>
          )}

          {}
          <div className="fixed -left-[4000px] top-0 pointer-events-none">
             <div ref={sharePosterRef} className="w-[600px] bg-white p-8 rounded-3xl shadow-2xl flex flex-col">
                {/* Poster Header */}
                <div className="bg-gradient-to-r from-blue-700 to-indigo-800 rounded-2xl p-6 text-white mb-6 shadow-md">
                   <h1 className="text-3xl font-extrabold tracking-tight mb-1">Available Class Slots</h1>
                   <h2 className="text-xl font-medium text-blue-100 flex items-center gap-2"><Icons.User size={20}/> Amar Bhushan</h2>
                   <div className="mt-4 inline-flex items-center gap-2 bg-white/20 px-3 py-1.5 rounded-lg text-sm font-semibold backdrop-blur-sm">
                      <Icons.Globe size={16}/> 
                      {timezones.find(t => t.value === shareConfig.tz)?.label}
                   </div>
                </div>
                
                {/* Poster Body / Grid */}
                <div className="flex-1 space-y-4">
                   {DAYS_OF_WEEK.map((day, idx) => {
                      const dayVacant = getVacantSlotsForPoster()[day];
                      if(!dayVacant || dayVacant.length === 0) return null;
                      
                      return (
                         <div key={idx} className="flex flex-col border border-gray-200 rounded-xl overflow-hidden shadow-sm">
                            <div className="bg-gray-100 px-4 py-2 border-b border-gray-200 font-bold text-lg text-gray-800">
                               {day}
                            </div>
                            <div className="p-4 grid grid-cols-2 gap-3 bg-white">
                               {dayVacant.map((slot, sIdx) => (
                                  <div key={sIdx} className="bg-green-50 border border-green-200 text-green-800 font-bold px-3 py-2 rounded-lg text-center shadow-sm">
                                     {slot.displayRange}
                                  </div>
                               ))}
                            </div>
                         </div>
                      );
                   })}
                   
                   {Object.values(getVacantSlotsForPoster()).flat().length === 0 && (
                      <div className="text-center py-10 text-gray-400 font-medium text-xl border-2 border-dashed border-gray-200 rounded-2xl">
                         No vacant slots available currently.
                      </div>
                   )}
                </div>

                {/* Poster Footer */}
                <div className="mt-8 text-center text-gray-500 font-medium text-sm pt-4 border-t border-gray-100">
                   Generated via Amar's Schedule • Message to confirm your booking!
                </div>
             </div>
          </div>

          {/* isAddModalOpen block begins */}
          {isSettingsOpen && (
            <div className="fixed inset-0 bg-gray-100 z-[70] flex flex-col">
              <div className="bg-white border-b px-4 py-4 flex items-center gap-4 safe-top shadow-sm">
                <button onClick={() => setIsSettingsOpen(false)} className="p-2 bg-gray-100 rounded-full text-gray-800"><Icons.X size={20} /></button>
                <h2 className="text-xl font-bold">Settings</h2>
              </div>

              <div className="flex-1 overflow-y-auto p-4 space-y-6 pb-24">
                
                <section className="bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
                  <h3 className="font-bold text-gray-900 mb-3 flex items-center gap-2"><Icons.Calendar size={18}/> Manage Slot Categories</h3>
                  <p className="text-xs text-gray-500 mb-3">Rename categories or add new ones (e.g. Late Night, Weekend).</p>
                  <div className="space-y-2 mb-4">
                     {slotDefinitions.map(slot => (
                        <div key={slot.id} className="flex gap-2 items-center">
                           <input
                             type="text"
                             value={slot.name}
                             onChange={(e) => handleUpdateSlotDefinition(slot.id, e.target.value)}
                             className="flex-1 p-2 border border-gray-300 rounded-lg outline-none text-sm focus:ring-2 focus:ring-blue-500 bg-gray-50 focus:bg-white"
                           />
                           <button 
                             onClick={() => setConfirmDialog({ action: 'deleteCategory', id: slot.id, title: 'Delete Category', message: `Are you sure you want to delete ${slot.name}? All schedules in this category will be moved to another.` })} 
                             className="p-2 text-red-500 hover:bg-red-50 rounded-lg border border-transparent hover:border-red-200 transition"
                           >
                             <Icons.Trash size={16}/>
                           </button>
                        </div>
                     ))}
                  </div>
                  <div className="flex gap-2 pt-3 border-t border-gray-100">
                     <input id="new-slot-name" type="text" placeholder="New category name..." className="flex-1 p-2 border border-gray-300 rounded-lg outline-none text-sm"/>
                     <button onClick={() => {
                         const el = document.getElementById('new-slot-name');
                         handleAddSlotDefinition(el.value);
                         el.value = '';
                     }} className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-bold transition shadow-sm">Add</button>
                  </div>
                </section>

                <section className="bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
                  <h3 className="font-bold text-gray-900 mb-2 flex items-center gap-2"><Icons.Link size={18}/> Default Meeting Link</h3>
                  <p className="text-xs text-gray-500 mb-3">This link will be included when copying or sharing reminders.</p>
                  <input 
                    type="url" placeholder="https://zoom.us/j/12345..." value={meetingLink} onChange={(e) => setMeetingLink(e.target.value)}
                    className="w-full p-3 border border-gray-300 rounded-xl outline-none text-sm focus:ring-2 focus:ring-blue-500"
                  />
                </section>

                <section className="bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
                  <h3 className="font-bold text-gray-900 mb-3 flex items-center gap-2"><Icons.Globe size={18}/> Time Zones</h3>
                  <label className="block text-xs font-bold text-gray-500 mb-1">My Default Time Zone</label>
                  <select 
                    value={myTimeZone} onChange={(e) => setMyTimeZone(e.target.value)}
                    className="w-full p-3 border border-gray-300 rounded-xl outline-none bg-gray-50 mb-4 text-sm"
                  >
                    {timezones.map(tz => <option key={tz.value} value={tz.value}>{tz.label}</option>)}
                  </select>

                  <div className="border-t pt-4">
                    <label className="block text-xs font-bold text-gray-500 mb-2">Add Custom Time Zone</label>
                    <div className="space-y-2">
                       <input id="new-tz-name" type="text" placeholder="Label (e.g. Japan)" className="w-full p-2 border rounded-lg outline-none text-sm"/>
                       <input id="new-tz-val" type="text" placeholder="TZ String (e.g. Asia/Tokyo)" className="w-full p-2 border rounded-lg outline-none text-sm font-mono"/>
                       <button 
                         onClick={() => {
                           const name = document.getElementById('new-tz-name').value;
                           const val = document.getElementById('new-tz-val').value;
                           if(name && val) {
                             setTimezones([...timezones, {label: name, value: val}]);
                             document.getElementById('new-tz-name').value = '';
                             document.getElementById('new-tz-val').value = '';
                             showToast("Timezone Added");
                           }
                         }} 
                         className="w-full py-2 bg-gray-800 text-white rounded-lg font-medium text-sm"
                       >
                         Add Timezone
                       </button>
                    </div>
                  </div>
                </section>
              </div>
            </div>
          )}

          {/* isStudentsModalOpen block begins */}
          {isStudentsModalOpen && (
            <div className="fixed inset-0 bg-gray-100 z-[75] flex flex-col">
              <div className="bg-white border-b px-4 py-4 flex items-center gap-4 safe-top shadow-sm">
                <button onClick={() => setIsStudentsModalOpen(false)} className="p-2 bg-gray-100 rounded-full text-gray-800"><Icons.X size={20} /></button>
                <h2 className="text-xl font-bold">Student Directory</h2>
              </div>
              <div className="flex-1 overflow-y-auto p-4 space-y-4 pb-24">
                 {students.length === 0 ? (
                    <div className="text-center py-10 text-gray-500 font-medium">No students added yet. <br/><span className="text-sm font-normal">Students are automatically added here when you assign them to a slot.</span></div>
                 ) : (
                    <div className="space-y-3">
                      {students.map(student => {
                        if (editingStudentInfo && editingStudentInfo.id === student.id) {
                           return (
                             <div key={student.id} className="bg-blue-50 p-4 rounded-xl shadow-sm border border-blue-200 space-y-3 animate-[slide-up_0.2s_ease-out]">
                               <input type="text" value={editingStudentInfo.name} onChange={e => setEditingStudentInfo({...editingStudentInfo, name: e.target.value})} className="w-full p-2 text-sm border border-blue-300 rounded-lg outline-none bg-white font-bold text-gray-800" placeholder="Student Name" />
                               <input type="text" value={editingStudentInfo.grade} onChange={e => setEditingStudentInfo({...editingStudentInfo, grade: e.target.value})} className="w-full p-2 text-sm border border-blue-300 rounded-lg outline-none bg-white" placeholder="Grade/Level" />
                               <input type="tel" value={editingStudentInfo.whatsapp} onChange={e => setEditingStudentInfo({...editingStudentInfo, whatsapp: e.target.value})} className="w-full p-2 text-sm border border-blue-300 rounded-lg outline-none bg-white" placeholder="WhatsApp Number" />
                               <select value={editingStudentInfo.timeZone} onChange={e => setEditingStudentInfo({...editingStudentInfo, timeZone: e.target.value})} className="w-full p-2 text-sm border border-blue-300 rounded-lg outline-none bg-white">
                                  {timezones.map(tz => <option key={tz.value} value={tz.value}>{tz.label}</option>)}
                               </select>
                               <div className="flex justify-end gap-2 mt-2 pt-2 border-t border-blue-200">
                                   <button onClick={() => setEditingStudentInfo(null)} className="px-4 py-2 bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 text-sm rounded-lg font-medium transition">Cancel</button>
                                   <button onClick={() => handleUpdateStudent(editingStudentInfo)} className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm rounded-lg font-medium shadow-sm transition">Save Changes</button>
                               </div>
                             </div>
                           );
                        }

                        return (
                          <div key={student.id} className="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex justify-between items-center group">
                             <div className="min-w-0 pr-3">
                                <h4 className="font-bold text-gray-900 text-lg flex items-center gap-2 truncate"><Icons.User size={16} className="text-blue-500 shrink-0"/> {student.name}</h4>
                                <p className="text-sm text-gray-600 mt-1 truncate">Grade: {student.grade || 'N/A'}</p>
                                <p className="text-sm text-gray-600 truncate" title={timezones.find(t=>t.value === student.timeZone)?.label}>TZ: {timezones.find(t=>t.value === student.timeZone)?.label || student.timeZone}</p>
                                <p className="text-sm text-gray-600 truncate">WhatsApp: {student.whatsapp || 'N/A'}</p>
                             </div>
                             <div className="flex flex-col gap-2 shrink-0">
                               <button onClick={() => setEditingStudentInfo(student)} className="p-2.5 text-gray-500 bg-gray-50 hover:bg-gray-100 border border-gray-200 rounded-xl transition">
                                 <Icons.Edit size={18}/>
                               </button>
                               <button 
                                 onClick={() => setConfirmDialog({ action: 'deleteStudent', id: student.id, title: 'Remove Student', message: `Are you sure you want to remove ${student.name} from the directory? This will also unassign them from ALL their current slots.` })}
                                 className="p-2.5 text-red-500 bg-red-50 hover:bg-red-100 border border-red-100 rounded-xl transition shrink-0"
                               >
                                 <Icons.Trash size={18}/>
                               </button>
                             </div>
                          </div>
                        );
                      })}
                    </div>
                 )}
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
