<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Amar Bhushan Schedule</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root { --sat: env(safe-area-inset-top); --sab: env(safe-area-inset-bottom); }
    .safe-top { padding-top: max(var(--sat), 1rem); }
    .pb-safe { padding-bottom: max(var(--sab), 1rem); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    body { -webkit-tap-highlight-color: transparent; font-family: 'Inter', sans-serif; }
    
    /* Custom date picker styling for native look */
    input[type="date"], input[type="time"] { min-height: 44px; }
    
    /* Hide native date picker calendar icon to use custom one */
    input[type="date"]::-webkit-calendar-picker-indicator {
        opacity: 0; width: 100%; height: 100%; position: absolute; top: 0; left: 0; cursor: pointer;
    }
  </style>
</head>
<body class="bg-gray-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const DEFAULT_TIMEZONES = [
      { value: 'Asia/Kolkata', label: 'India (IST)' },
      { value: 'America/New_York', label: 'USA Eastern (EST/EDT)' },
      { value: 'America/Los_Angeles', label: 'USA Pacific (PST/PDT)' },
      { value: 'Europe/London', label: 'UK (GMT/BST)' },
      { value: 'Australia/Sydney', label: 'Australia (AEST/AEDT)' },
      { value: 'Asia/Dubai', label: 'UAE (GST)' },
    ];

    const DEFAULT_SLOT_TYPES = [
      { id: 'morning', name: 'Morning', color: 'bg-yellow-100 border-yellow-300 text-yellow-800' },
      { id: 'afternoon', name: 'Afternoon', color: 'bg-orange-100 border-orange-300 text-orange-800' },
      { id: 'evening', name: 'Evening', color: 'bg-indigo-100 border-indigo-300 text-indigo-800' },
      { id: 'night', name: 'Night', color: 'bg-slate-100 border-slate-300 text-slate-800' },
    ];

    const DAYS_OF_WEEK = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

    const Icons = {
      Plus: ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
      Trash: ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>,
      Calendar: ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>,
      Clock: ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>,
      Globe: ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>,
      User: ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>,
      Edit: ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>,
      X: ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>,
      Settings: ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>,
      MessageCircle: ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>,
      Copy: ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>,
      Link: ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
    };

    const toDateString = (date) => {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    };

    const addDays = (date, days) => new Date(date.getTime() + days * 86400000);
    
    const startOfWeek = (date) => {
      const d = new Date(date);
      const day = d.getDay();
      const diff = d.getDate() - day + (day === 0 ? -6 : 1); 
      return new Date(d.setDate(diff));
    };

    function App() {
      const [myTimeZone, setMyTimeZone] = useState(() => localStorage.getItem('amar_myTz') || 'Asia/Kolkata');
      const [meetingLink, setMeetingLink] = useState(() => localStorage.getItem('amar_meetingLink') || '');
      
      const [selectedWeekStart, setSelectedWeekStart] = useState(startOfWeek(new Date()));
      const [activeSlotFilter, setActiveSlotFilter] = useState('all');
      
      const [toastMsg, setToastMsg] = useState(null);

      const [slotDefinitions, setSlotDefinitions] = useState(() => {
        const saved = localStorage.getItem('amar_slotDefs');
        return saved ? JSON.parse(saved) : DEFAULT_SLOT_TYPES;
      });

      const [timezones, setTimezones] = useState(() => {
        const saved = localStorage.getItem('amar_timezones');
        return saved ? JSON.parse(saved) : DEFAULT_TIMEZONES;
      });

      const [schedules, setSchedules] = useState(() => {
        const saved = localStorage.getItem('amar_schedules');
        return saved ? JSON.parse(saved) : [];
      });

      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [selectedSlotDetails, setSelectedSlotDetails] = useState(null);
      const [editingScheduleId, setEditingScheduleId] = useState(null);
      const [confirmDialog, setConfirmDialog] = useState(null); // Added state for the confirmation popup

      const [formData, setFormData] = useState({
        dayOfWeek: 'all', 
        exactDate: toDateString(new Date()),
        slotTypeId: DEFAULT_SLOT_TYPES[0].id,
        startTime: '05:00',
        endTime: '06:00',
        studentName: '',
        whatsapp: '',
        grade: '',
        isDemo: false,
        studentTimeZone: 'Australia/Sydney'
      });

      useEffect(() => {
        localStorage.setItem('amar_schedules', JSON.stringify(schedules));
        localStorage.setItem('amar_slotDefs', JSON.stringify(slotDefinitions));
        localStorage.setItem('amar_timezones', JSON.stringify(timezones));
        localStorage.setItem('amar_myTz', myTimeZone);
        localStorage.setItem('amar_meetingLink', meetingLink);
      }, [schedules, slotDefinitions, timezones, myTimeZone, meetingLink]);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3000);
      };

      const copyToClipboard = (text) => {
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text).then(() => showToast("Copied to clipboard!"));
        } else {
            let textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try { document.execCommand('copy'); showToast("Copied to clipboard!"); } 
            catch (err) { showToast("Failed to copy"); }
            textArea.remove();
        }
      };

      const weekDates = useMemo(() => {
        return Array.from({ length: 7 }).map((_, i) => addDays(selectedWeekStart, i));
      }, [selectedWeekStart]);

      const getStudentTime = (myTimeStr, studentTz) => {
        try {
          const [hours, minutes] = myTimeStr.split(':');
          const date = new Date();
          date.setHours(parseInt(hours, 10), parseInt(minutes, 10), 0);
          return new Intl.DateTimeFormat('en-US', { timeZone: studentTz, hour: '2-digit', minute: '2-digit', hour12: true }).format(date);
        } catch (e) {
          return 'Invalid Time';
        }
      };

      const getGreeting = (myTimeStr, studentTz) => {
        try {
          const [hours, minutes] = myTimeStr.split(':');
          const d = new Date();
          d.setHours(parseInt(hours, 10), parseInt(minutes, 10), 0);
          const formatter = new Intl.DateTimeFormat('en-US', { timeZone: studentTz, hour: 'numeric', hour12: false });
          const studentHour = parseInt(formatter.format(d), 10);
          
          if (studentHour >= 4 && studentHour < 12) return 'Good Morning';
          if (studentHour >= 12 && studentHour < 17) return 'Good Afternoon';
          return 'Good Evening';
        } catch (e) {
          return 'Hello';
        }
      };

      const generateMessage = (sch, viewDate) => {
        const greeting = getGreeting(sch.startTime, sch.studentTimeZone);
        const namePart = sch.studentName ? ` ${sch.studentName.split(' ')[0]}` : '';
        const dateStr = viewDate.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
        const timeStr = getStudentTime(sch.startTime, sch.studentTimeZone);
        
        let msg = `${greeting}${namePart},\n\nJust a reminder that we have a session scheduled on ${dateStr} at ${timeStr} (Your Time).`;
        if (meetingLink) msg += `\n\nMeeting Link: ${meetingLink}`;
        msg += `\n\nBest regards,\nAmar Bhushan`;
        return msg;
      };

      const handleDateChange = (e) => {
        if(!e.target.value) return;
        const d = new Date(e.target.value);
        setSelectedWeekStart(startOfWeek(d));
      };

      const handleSaveSchedule = (e) => {
        e.preventDefault();
        const payload = { ...formData, isDemo: formData.isDemo || false };
        if (editingScheduleId) {
          setSchedules(schedules.map(sch => sch.id === editingScheduleId ? { ...payload, id: editingScheduleId } : sch));
        } else {
          setSchedules([...schedules, { ...payload, id: Date.now().toString() }]);
        }
        setIsAddModalOpen(false);
        setEditingScheduleId(null);
        setSelectedSlotDetails(null);
      };

      const handleDeleteSchedule = (id) => {
        setSchedules(schedules.filter(sch => sch.id !== id));
        setSelectedSlotDetails(null);
      };

      const handleUnassignStudent = (id) => {
        setSchedules(schedules.map(sch => sch.id === id ? { ...sch, studentName: '', grade: '', whatsapp: '', isDemo: false } : sch));
        setSelectedSlotDetails(null);
      };

      // Helper function to execute the action after user confirms
      const handleConfirmAction = () => {
        if (!confirmDialog) return;
        if (confirmDialog.action === 'delete') {
          handleDeleteSchedule(confirmDialog.id);
        } else if (confirmDialog.action === 'unassign') {
          handleUnassignStudent(confirmDialog.id);
        }
        setConfirmDialog(null); // Close the dialog after execution
      };

      const openAddModal = (initialData = {}) => {
        setFormData({
          dayOfWeek: 'all',
          exactDate: toDateString(new Date()),
          slotTypeId: slotDefinitions[0].id,
          startTime: '12:00',
          endTime: '13:00',
          studentName: '',
          whatsapp: '',
          grade: '',
          isDemo: false,
          studentTimeZone: 'Australia/Sydney',
          ...initialData
        });
        setEditingScheduleId(null);
        setIsAddModalOpen(true);
      };

      const openEditModal = (schedule) => {
        setFormData(schedule);
        setEditingScheduleId(schedule.id);
        setIsAddModalOpen(true);
        setSelectedSlotDetails(null); // Close details pop to show edit
      };

      const getSlotsForDate = (date) => {
        const dayStr = date.getDay().toString();
        const dateStr = toDateString(date);
        
        return schedules.filter(sch => {
          // Check if slot belongs to this date
          const matchesDate = 
            sch.dayOfWeek === 'all' || 
            sch.dayOfWeek === dayStr || 
            (sch.dayOfWeek === 'exact' && sch.exactDate === dateStr);
            
          // Check if slot matches category filter
          const matchesFilter = activeSlotFilter === 'all' || sch.slotTypeId === activeSlotFilter;
          
          return matchesDate && matchesFilter;
        }).sort((a, b) => a.startTime.localeCompare(b.startTime));
      };

      return (
        <div className="flex flex-col h-screen bg-gray-100 font-sans text-gray-900 w-full max-w-md mx-auto relative overflow-hidden shadow-2xl ring-1 ring-gray-200">
          
          {/* Toast Notification */}
          {toastMsg && (
            <div className="absolute top-20 left-1/2 -translate-x-1/2 bg-gray-800 text-white px-4 py-2 rounded-full shadow-lg z-50 text-sm font-medium animate-bounce">
              {toastMsg}
            </div>
          )}

          {/* Header */}
          <header className="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-10 safe-top">
            <div className="flex justify-between items-center mb-2">
              <h1 className="text-xl font-bold tracking-tight">Amar's Schedule</h1>
              <div className="flex gap-2 relative">
                <div className="relative p-2 bg-blue-700 rounded-full hover:bg-blue-800 transition overflow-hidden">
                   <Icons.Calendar size={20} />
                   <input 
                     type="date" 
                     value={toDateString(selectedWeekStart)} 
                     onChange={handleDateChange} 
                     className="absolute inset-0 opacity-0 w-full h-full cursor-pointer"
                   />
                </div>
                <button onClick={() => setIsSettingsOpen(true)} className="p-2 bg-blue-700 rounded-full hover:bg-blue-800 transition">
                  <Icons.Settings size={20} />
                </button>
              </div>
            </div>
            <div className="text-sm font-medium text-blue-100 flex items-center gap-1 bg-blue-700/50 p-2 rounded-lg">
              <Icons.Clock size={16} />
              My Time: {timezones.find(t => t.value === myTimeZone)?.label || myTimeZone}
            </div>
          </header>

          {/* Main Content Area - Vertical Days & Horizontal Slots */}
          <div className="flex-1 overflow-y-auto flex flex-col pb-24">
            
            {/* Filter Chips */}
            <div className="bg-gray-50 border-b border-gray-200 p-3 flex gap-2 overflow-x-auto no-scrollbar sticky top-0 z-10">
              <button
                onClick={() => setActiveSlotFilter('all')}
                className={`whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-medium transition-colors border ${
                  activeSlotFilter === 'all' ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-gray-700 border-gray-300'
                }`}
              >
                All
              </button>
              {slotDefinitions.map(slot => (
                <button
                  key={slot.id}
                  onClick={() => setActiveSlotFilter(slot.id)}
                  className={`whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-medium transition-colors border ${
                    activeSlotFilter === slot.id ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-gray-700 border-gray-300'
                  }`}
                >
                  {slot.name}
                </button>
              ))}
            </div>
            
            {/* Vertical Week List */}
            <div className="p-4 flex flex-col gap-5">
              {weekDates.map(date => {
                const daySlots = getSlotsForDate(date);
                const isToday = toDateString(date) === toDateString(new Date());
                
                return (
                  <div key={date.toString()} className={`bg-white rounded-2xl border ${isToday ? 'border-blue-300 shadow-md ring-1 ring-blue-100' : 'border-gray-200 shadow-sm'} overflow-hidden`}>
                    
                    {/* Day Header */}
                    <div className={`px-4 py-2 border-b flex justify-between items-center ${isToday ? 'bg-blue-50' : 'bg-gray-50'}`}>
                      <h3 className={`font-bold ${isToday ? 'text-blue-700' : 'text-gray-800'}`}>
                        {date.toLocaleDateString('en-US', { weekday: 'long' })}
                        <span className="text-gray-500 font-normal ml-2 text-sm">{date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</span>
                      </h3>
                      <button 
                        onClick={() => openAddModal({ dayOfWeek: date.getDay().toString() })}
                        className="p-1 text-gray-400 hover:text-blue-600 transition bg-white rounded-full border shadow-sm"
                      >
                        <Icons.Plus size={16} />
                      </button>
                    </div>

                    {/* Horizontal Slots List */}
                    <div className="p-3">
                      {daySlots.length === 0 ? (
                        <div className="text-center py-4 text-sm text-gray-400 font-medium">No slots</div>
                      ) : (
                        <div className="flex gap-3 overflow-x-auto no-scrollbar pb-1">
                          {daySlots.map(sch => {
                            const isVacant = !sch.studentName;
                            const slotDef = slotDefinitions.find(s => s.id === sch.slotTypeId) || slotDefinitions[0];
                            const isDemo = sch.isDemo;

                            return (
                              <div 
                                key={sch.id}
                                onClick={() => setSelectedSlotDetails({ sch, date })}
                                className={`shrink-0 w-48 rounded-xl border p-3 cursor-pointer transition active:scale-95 flex flex-col justify-between ${
                                  isVacant ? 'bg-green-50 border-green-200' : 
                                  isDemo ? 'bg-yellow-50 border-yellow-400 ring-1 ring-yellow-200' : 
                                  'bg-white border-gray-200 hover:border-blue-300'
                                }`}
                              >
                                <div>
                                  <div className="flex justify-between items-start mb-1">
                                    <span className="text-xs font-bold flex items-center gap-1 text-gray-500">
                                      <Icons.Clock size={12}/> {sch.startTime}
                                    </span>
                                    {isDemo && !isVacant && <span className="text-[10px] bg-yellow-400 text-yellow-900 font-bold px-1.5 py-0.5 rounded uppercase tracking-wide">Demo</span>}
                                  </div>
                                  
                                  <h4 className={`font-bold truncate text-sm mt-1 ${isVacant ? 'text-green-700' : 'text-gray-900'}`}>
                                    {isVacant ? 'VACANT' : sch.studentName}
                                  </h4>
                                </div>
                                
                                <div className="mt-2 flex justify-between items-center">
                                  <span className={`text-[10px] px-2 py-0.5 rounded font-semibold uppercase ${slotDef.color}`}>
                                    {slotDef.name}
                                  </span>
                                  {!isVacant && (
                                    <span className="text-[10px] text-gray-500 font-medium max-w-[60px] truncate">
                                      {timezones.find(t => t.value === sch.studentTimeZone)?.label.split(' ')[0]}
                                    </span>
                                  )}
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Floating Add Button */}
          <button 
            onClick={() => openAddModal()}
            className="absolute bottom-6 right-6 w-14 h-14 bg-blue-600 text-white rounded-full shadow-lg shadow-blue-300 flex items-center justify-center hover:bg-blue-700 hover:scale-105 active:scale-95 transition-all z-20"
          >
            <Icons.Plus size={28} />
          </button>

          {}
          {selectedSlotDetails && (
            <div className="fixed inset-0 bg-black/60 z-50 flex flex-col justify-end sm:justify-center sm:p-4 backdrop-blur-sm">
              <div className="bg-white w-full sm:max-w-md sm:mx-auto rounded-t-3xl sm:rounded-2xl shadow-2xl flex flex-col animate-[slide-up_0.2s_ease-out]">
                
                {/* Header */}
                <div className="flex justify-between items-center p-4 border-b">
                  <h2 className="text-xl font-bold text-gray-800">Slot Details</h2>
                  <button onClick={() => setSelectedSlotDetails(null)} className="p-2 bg-gray-100 rounded-full text-gray-600"><Icons.X size={20} /></button>
                </div>
                
                {/* Content */}
                <div className="p-5 space-y-4">
                  {/* Slot Time & Date Info */}
                  <div className="bg-gray-50 rounded-xl p-4 border">
                    <div className="text-sm text-gray-500 font-medium mb-1 flex items-center gap-2">
                       <Icons.Calendar size={16}/> 
                       {selectedSlotDetails.date.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })}
                    </div>
                    <div className="text-lg font-bold text-gray-900 flex items-center gap-2">
                       <Icons.Clock size={18} className="text-blue-500"/>
                       {selectedSlotDetails.sch.startTime} - {selectedSlotDetails.sch.endTime} (My Time)
                    </div>
                    <div className="mt-2 text-xs font-semibold uppercase px-2 py-1 bg-gray-200 text-gray-700 rounded inline-block">
                      {slotDefinitions.find(s => s.id === selectedSlotDetails.sch.slotTypeId)?.name || 'Slot'}
                    </div>
                  </div>

                  {/* Student Info */}
                  {!selectedSlotDetails.sch.studentName ? (
                     <div className="p-4 bg-green-50 border border-green-200 rounded-xl flex justify-between items-center">
                        <span className="font-bold text-green-700">This slot is VACANT</span>
                        <button onClick={() => openEditModal(selectedSlotDetails.sch)} className="px-4 py-2 bg-green-600 text-white rounded-lg text-sm font-medium">Assign</button>
                     </div>
                  ) : (
                    <div className={`p-4 border rounded-xl relative ${selectedSlotDetails.sch.isDemo ? 'bg-yellow-50 border-yellow-300' : 'bg-white'}`}>
                      {selectedSlotDetails.sch.isDemo && <div className="absolute top-0 right-0 bg-yellow-400 text-yellow-900 text-[10px] font-bold px-2 py-1 rounded-bl-lg rounded-tr-xl">DEMO</div>}
                      
                      <h3 className="text-xl font-bold text-gray-900 flex items-center gap-2 mb-3">
                        <Icons.User size={20} className="text-blue-500"/>
                        {selectedSlotDetails.sch.studentName} 
                        {selectedSlotDetails.sch.grade && <span className="text-sm font-normal text-gray-500">({selectedSlotDetails.sch.grade})</span>}
                      </h3>
                      
                      <div className="grid grid-cols-2 gap-2 text-sm bg-gray-50 p-3 rounded-lg border">
                         <div>
                            <span className="block text-xs text-gray-500">Student Time</span>
                            <span className="font-bold text-blue-700">{getStudentTime(selectedSlotDetails.sch.startTime, selectedSlotDetails.sch.studentTimeZone)}</span>
                         </div>
                         <div>
                            <span className="block text-xs text-gray-500">Timezone</span>
                            <span className="font-medium text-gray-800 truncate block">{timezones.find(t => t.value === selectedSlotDetails.sch.studentTimeZone)?.label.split(' ')[0]}</span>
                         </div>
                      </div>

                      {/* Actions */}
                      <div className="mt-4 grid grid-cols-2 gap-2">
                         <button 
                           onClick={() => {
                             const msg = generateMessage(selectedSlotDetails.sch, selectedSlotDetails.date);
                             if(selectedSlotDetails.sch.whatsapp) {
                               const phone = selectedSlotDetails.sch.whatsapp.replace(/\D/g,'');
                               window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
                             } else {
                               showToast("No WhatsApp number provided");
                             }
                           }}
                           className={`flex items-center justify-center gap-2 py-2 rounded-lg font-medium text-sm transition ${selectedSlotDetails.sch.whatsapp ? 'bg-green-500 text-white hover:bg-green-600' : 'bg-gray-100 text-gray-400 cursor-not-allowed'}`}
                         >
                            <Icons.MessageCircle size={16}/> Send WhatsApp
                         </button>
                         <button 
                           onClick={() => copyToClipboard(generateMessage(selectedSlotDetails.sch, selectedSlotDetails.date))}
                           className="flex items-center justify-center gap-2 bg-blue-50 text-blue-700 hover:bg-blue-100 py-2 rounded-lg font-medium text-sm transition"
                         >
                            <Icons.Copy size={16}/> Copy Reminder
                         </button>
                      </div>
                    </div>
                  )}
                </div>
                
                {/* Footer Admin Actions */}
                <div className="p-4 bg-gray-50 border-t flex justify-between pb-safe">
                   <button onClick={() => setConfirmDialog({ action: 'delete', id: selectedSlotDetails.sch.id, title: 'Delete Slot', message: 'Are you sure you want to permanently delete this time slot?' })} className="text-red-500 font-medium px-4 py-2 hover:bg-red-50 rounded-lg flex items-center gap-1 text-sm"><Icons.Trash size={16}/> Delete Slot</button>
                   <div className="flex gap-2">
                     {selectedSlotDetails.sch.studentName && (
                        <button onClick={() => setConfirmDialog({ action: 'unassign', id: selectedSlotDetails.sch.id, title: 'Unassign Student', message: 'Are you sure you want to remove the student and make this slot vacant?' })} className="text-orange-600 border border-orange-200 bg-orange-50 font-medium px-4 py-2 rounded-lg text-sm">Unassign</button>
                     )}
                     <button onClick={() => openEditModal(selectedSlotDetails.sch)} className="bg-gray-200 text-gray-800 font-medium px-4 py-2 rounded-lg flex items-center gap-1 text-sm"><Icons.Edit size={16}/> Edit</button>
                   </div>
                </div>
              </div>
            </div>
          )}

          {/* Confirmation Dialog Popup */}
          {confirmDialog && (
            <div className="fixed inset-0 bg-black/60 z-[80] flex items-center justify-center p-4 backdrop-blur-sm">
              <div className="bg-white w-full max-w-sm rounded-2xl shadow-xl p-6 animate-[slide-up_0.2s_ease-out]">
                <h3 className="text-xl font-bold text-gray-900 mb-2">{confirmDialog.title}</h3>
                <p className="text-gray-600 text-sm mb-6">{confirmDialog.message}</p>
                <div className="flex gap-3 justify-end">
                  <button 
                    onClick={() => setConfirmDialog(null)} 
                    className="px-4 py-2 text-gray-700 font-medium bg-gray-100 hover:bg-gray-200 rounded-lg transition"
                  >
                    Cancel
                  </button>
                  <button 
                    onClick={handleConfirmAction} 
                    className={`px-4 py-2 text-white font-medium rounded-lg transition ${confirmDialog.action === 'delete' ? 'bg-red-600 hover:bg-red-700' : 'bg-orange-600 hover:bg-orange-700'}`}
                  >
                    {confirmDialog.action === 'delete' ? 'Delete' : 'Unassign'}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* isAddModalOpen block begins */}
          {isAddModalOpen && (
            <div className="fixed inset-0 bg-black/60 z-[60] flex flex-col justify-end sm:justify-center sm:p-4 backdrop-blur-sm">
              <div className="bg-white w-full sm:max-w-md sm:mx-auto rounded-t-3xl sm:rounded-2xl shadow-2xl flex flex-col max-h-[90vh]">
                <div className="flex justify-between items-center p-4 border-b">
                  <h2 className="text-xl font-bold text-gray-800">{editingScheduleId ? 'Edit Slot' : 'Create New Slot'}</h2>
                  <button onClick={() => setIsAddModalOpen(false)} className="p-2 bg-gray-100 rounded-full text-gray-600"><Icons.X size={20} /></button>
                </div>
                
                <div className="overflow-y-auto p-4 flex-1">
                  <form id="schedule-form" onSubmit={handleSaveSchedule} className="space-y-4">
                    
                    {/* Occurence / Type */}
                    <div className="grid grid-cols-2 gap-4">
                      <div>
                        <label className="block text-sm font-medium text-gray-700 mb-1">Repeats / Occurs</label>
                        <select 
                          value={formData.dayOfWeek}
                          onChange={(e) => setFormData({...formData, dayOfWeek: e.target.value})}
                          className="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none bg-white text-sm"
                        >
                          <option value="all">Every Day</option>
                          {DAYS_OF_WEEK.map((day, idx) => <option key={idx} value={idx.toString()}>Every {day}</option>)}
                          <option value="exact">Specific Date</option>
                        </select>
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-gray-700 mb-1">Category</label>
                        <select 
                          value={formData.slotTypeId}
                          onChange={(e) => setFormData({...formData, slotTypeId: e.target.value})}
                          className="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none bg-white text-sm"
                        >
                          {slotDefinitions.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                        </select>
                      </div>
                    </div>

                    {/* Exact Date Picker if selected */}
                    {formData.dayOfWeek === 'exact' && (
                       <div className="bg-blue-50 p-3 rounded-xl border border-blue-200 animate-pulse">
                         <label className="block text-sm font-bold text-blue-800 mb-1">Select Exact Date</label>
                         <input 
                           type="date" required
                           value={formData.exactDate}
                           onChange={(e) => setFormData({...formData, exactDate: e.target.value})}
                           className="w-full p-2 border border-blue-300 rounded-lg outline-none bg-white font-medium"
                         />
                       </div>
                    )}

                    {/* Timings */}
                    <div className="bg-gray-50 p-3 rounded-xl border border-gray-200">
                      <h4 className="text-sm font-bold text-gray-700 mb-2">Timings (My Time)</h4>
                      <div className="grid grid-cols-2 gap-4">
                        <div className="min-w-0">
                          <label className="block text-xs text-gray-500 mb-1">Start Time</label>
                          <input type="time" required value={formData.startTime} onChange={(e) => setFormData({...formData, startTime: e.target.value})} className="min-w-0 w-full p-2 text-sm appearance-none border border-gray-300 rounded-lg outline-none bg-white"/>
                        </div>
                        <div className="min-w-0">
                          <label className="block text-xs text-gray-500 mb-1">End Time</label>
                          <input type="time" required value={formData.endTime} onChange={(e) => setFormData({...formData, endTime: e.target.value})} className="min-w-0 w-full p-2 text-sm appearance-none border border-gray-300 rounded-lg outline-none bg-white"/>
                        </div>
                      </div>
                    </div>

                    {/* Student Details section */}
                    <div className="pt-2 border-t">
                      <div className="flex justify-between items-center mb-2">
                        <label className="block text-sm font-bold text-gray-800">Student Assignment</label>
                        <span className="text-[10px] text-green-700 font-bold bg-green-100 px-2 py-0.5 rounded border border-green-200">Leave empty for VACANT</span>
                      </div>
                      
                      <div className="space-y-3">
                         <input 
                           type="text" placeholder="Student Name (e.g. John Doe)" value={formData.studentName} onChange={(e) => setFormData({...formData, studentName: e.target.value})}
                           className="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm"
                         />
                         
                         {/* Extra fields only if student is assigned */}
                         {formData.studentName && (
                           <>
                             <label className="flex items-center gap-2 p-3 bg-yellow-50 border border-yellow-300 rounded-xl cursor-pointer">
                               <input type="checkbox" checked={formData.isDemo} onChange={(e) => setFormData({...formData, isDemo: e.target.checked})} className="w-5 h-5 text-yellow-600 rounded focus:ring-yellow-500"/>
                               <span className="text-sm font-bold text-yellow-900">This is a Demo Class</span>
                             </label>

                             <div className="grid grid-cols-2 gap-3">
                               <input 
                                 type="text" placeholder="Grade/Level" value={formData.grade} onChange={(e) => setFormData({...formData, grade: e.target.value})}
                                 className="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm"
                               />
                               <input 
                                 type="tel" placeholder="WhatsApp (e.g. +61...)" value={formData.whatsapp} onChange={(e) => setFormData({...formData, whatsapp: e.target.value})}
                                 className="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm"
                               />
                             </div>

                             <div>
                               <label className="block text-xs font-bold text-gray-500 mb-1">Student Time Zone</label>
                               <select 
                                 value={formData.studentTimeZone}
                                 onChange={(e) => setFormData({...formData, studentTimeZone: e.target.value})}
                                 className="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none bg-white text-sm"
                               >
                                 {timezones.map(tz => <option key={tz.value} value={tz.value}>{tz.label}</option>)}
                               </select>
                             </div>
                           </>
                         )}
                      </div>
                    </div>

                  </form>
                </div>
                
                <div className="p-4 border-t bg-gray-50 pb-safe">
                  <button type="submit" form="schedule-form" className="w-full py-4 bg-blue-600 text-white font-bold rounded-xl shadow-lg shadow-blue-200 hover:bg-blue-700 active:scale-[0.98] transition-all">
                    {editingScheduleId ? 'Save Slot Updates' : 'Create Slot'}
                  </button>
                </div>
              </div>
            </div>
          )}

          {}
          {isSettingsOpen && (
            <div className="fixed inset-0 bg-gray-100 z-[70] flex flex-col">
              <div className="bg-white border-b px-4 py-4 flex items-center gap-4 safe-top shadow-sm">
                <button onClick={() => setIsSettingsOpen(false)} className="p-2 bg-gray-100 rounded-full text-gray-800"><Icons.X size={20} /></button>
                <h2 className="text-xl font-bold">Settings</h2>
              </div>

              <div className="flex-1 overflow-y-auto p-4 space-y-6 pb-24">
                
                <section className="bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
                  <h3 className="font-bold text-gray-900 mb-2 flex items-center gap-2"><Icons.Link size={18}/> Default Meeting Link</h3>
                  <p className="text-xs text-gray-500 mb-3">This link will be included when copying or sharing reminders.</p>
                  <input 
                    type="url" placeholder="https://zoom.us/j/12345..." value={meetingLink} onChange={(e) => setMeetingLink(e.target.value)}
                    className="w-full p-3 border border-gray-300 rounded-xl outline-none text-sm focus:ring-2 focus:ring-blue-500"
                  />
                </section>

                <section className="bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
                  <h3 className="font-bold text-gray-900 mb-3 flex items-center gap-2"><Icons.Globe size={18}/> Time Zones</h3>
                  <label className="block text-xs font-bold text-gray-500 mb-1">My Default Time Zone</label>
                  <select 
                    value={myTimeZone} onChange={(e) => setMyTimeZone(e.target.value)}
                    className="w-full p-3 border border-gray-300 rounded-xl outline-none bg-gray-50 mb-4 text-sm"
                  >
                    {timezones.map(tz => <option key={tz.value} value={tz.value}>{tz.label}</option>)}
                  </select>

                  <div className="border-t pt-4">
                    <label className="block text-xs font-bold text-gray-500 mb-2">Add Custom Time Zone</label>
                    <div className="space-y-2">
                       <input id="new-tz-name" type="text" placeholder="Label (e.g. Japan)" className="w-full p-2 border rounded-lg outline-none text-sm"/>
                       <input id="new-tz-val" type="text" placeholder="TZ String (e.g. Asia/Tokyo)" className="w-full p-2 border rounded-lg outline-none text-sm font-mono"/>
                       <button 
                         onClick={() => {
                           const name = document.getElementById('new-tz-name').value;
                           const val = document.getElementById('new-tz-val').value;
                           if(name && val) {
                             setTimezones([...timezones, {label: name, value: val}]);
                             document.getElementById('new-tz-name').value = '';
                             document.getElementById('new-tz-val').value = '';
                             showToast("Timezone Added");
                           }
                         }} 
                         className="w-full py-2 bg-gray-800 text-white rounded-lg font-medium text-sm"
                       >
                         Add Timezone
                       </button>
                    </div>
                  </div>
                </section>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
